name: Java build

# Builds the Java version: compile, tests, Checkstyle, Error Prone, JaCoCo and PIT (see Java/docs/adr/0009),
# then checks the TextTest fixture output against the approved golden master.
on:
  push:
    branches: [main]
    paths: [Java/**, texttests/**, .github/workflows/java-build.yml]
  pull_request:
    paths: [Java/**, texttests/**, .github/workflows/java-build.yml]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Java
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25

      # Also validates the Gradle wrapper jar against the official checksums.
      - uses: gradle/actions/setup-gradle@v6

      - name: Build with all quality checks
        run: ./gradlew build

      - name: Compare fixture output with the golden master
        run: ./gradlew -q text | diff - ../texttests/ThirtyDays/stdout.gr

      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: Java/build/reports/
