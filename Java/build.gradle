plugins {
    id 'java'
    id 'checkstyle'
    id 'jacoco'
    id 'net.ltgt.errorprone' version '5.2.0'
    id 'info.solidsoft.pitest' version '1.19.0'
}

group = 'com.gildedrose'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    errorprone 'com.google.errorprone:error_prone_core:2.52.0'

    testImplementation platform('org.junit:junit-bom:6.1.3')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// All compiler and Error Prone warnings fail the build.
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs += ['-Xlint:all', '-Werror']
}

checkstyle {
    toolVersion = '14.4.0'
    configFile = file('config/checkstyle/checkstyle.xml')
    configProperties = [
        'org.checkstyle.google.suppressionfilter.config': file('config/checkstyle/suppressions.xml').path,
    ]
    maxWarnings = 0
    ignoreFailures = false
}

tasks.named('test', Test) {
    useJUnitPlatform()
    finalizedBy tasks.named('jacocoTestReport')
}

jacoco {
    toolVersion = '0.8.16'
}

tasks.named('jacocoTestReport', JacocoReport) {
    dependsOn tasks.named('test')
    reports {
        xml.required = true
        html.required = true
    }
}

// Every line and every branch of the production code must be covered.
tasks.named('jacocoTestCoverageVerification', JacocoCoverageVerification) {
    dependsOn tasks.named('test')
    violationRules {
        rule {
            limit {
                counter = 'LINE'
                minimum = 1.0
            }
            limit {
                counter = 'BRANCH'
                minimum = 1.0
            }
        }
    }
}

// Mutation testing: every mutant of the production code must be killed by a test.
pitest {
    pitestVersion = '1.30.2'
    junit5PluginVersion = '1.2.3'
    targetClasses = ['com.gildedrose.*']
    mutationThreshold = 100
    coverageThreshold = 100
    timestampedReports = false
    outputFormats = ['HTML', 'XML']
}

tasks.named('check') {
    dependsOn tasks.named('jacocoTestCoverageVerification'), tasks.named('pitest')
}

// Runs the TextTest fixture; README.md and texttest_rig.py call this task 'text'.
tasks.register('text', JavaExec) {
    description = 'Runs the TextTest fixture (default 30 days, override with --args N).'
    group = 'application'
    mainClass = 'com.gildedrose.TexttestFixture'
    classpath = sourceSets.test.runtimeClasspath
    args '30'
}
