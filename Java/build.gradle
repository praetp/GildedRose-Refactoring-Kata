plugins {
    id 'java'
}

group = 'com.gildedrose'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    testImplementation platform('org.junit:junit-bom:6.1.3')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test', Test) {
    useJUnitPlatform()
}

// Runs the TextTest fixture; README.md and texttest_rig.py call this task 'text'.
tasks.register('text', JavaExec) {
    description = 'Runs the TextTest fixture (default 30 days, override with --args N).'
    group = 'application'
    mainClass = 'com.gildedrose.TexttestFixture'
    classpath = sourceSets.test.runtimeClasspath
    args '30'
}
